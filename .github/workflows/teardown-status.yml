name: Inspect FIAP teardown status read-only
on:
  push:
    branches: [codex/teardown-status]
permissions: {}
jobs:
  status:
    runs-on: ubuntu-latest
    environment: homolog
    timeout-minutes: 3
    env:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.HOMOLOG_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HOMOLOG_AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.HOMOLOG_AWS_SESSION_TOKEN }}
    steps:
      - name: Read project resource states without credentials or data
        run: |
          python3 - <<'PYTHON'
          import subprocess,json,datetime
          def aws(*args):
              return json.loads(subprocess.check_output(['aws',*args,'--output','json'],text=True))
          assert aws('sts','get-caller-identity')['Account']=='630266487412'
          clusters=aws('eks','list-clusters')['clusters']
          result={'time':datetime.datetime.now(datetime.timezone.utc).isoformat(),'eks':'absent'}
          if 'oficina' in clusters:result['eks']=aws('eks','describe-cluster','--name','oficina')['cluster']['status']
          result['nodegroups']=[]
          if 'oficina' in clusters:
              for group in aws('eks','list-nodegroups','--cluster-name','oficina')['nodegroups']:
                  result['nodegroups'].append(aws('eks','describe-nodegroup','--cluster-name','oficina','--nodegroup-name',group)['nodegroup']['status'])
          reservations=aws('ec2','describe-instances','--filters','Name=tag:eks:cluster-name,Values=oficina','Name=instance-state-name,Values=pending,running,stopping,stopped,shutting-down')['Reservations']
          result['node_instances']=[i['State']['Name'] for r in reservations for i in r['Instances']]
          result['rds']=[x['DBInstanceStatus'] for x in aws('rds','describe-db-instances')['DBInstances'] if x['DBInstanceIdentifier']=='oficina-homolog']
          result['lambdas']=sum(x['FunctionName'].startswith('oficina') for x in aws('lambda','list-functions')['Functions'])
          result['gateways']=sum(x['Name'].startswith('oficina-') for x in aws('apigatewayv2','get-apis')['Items'])
          result['cluster_security_groups']=sum(x['GroupName'].startswith('eks-cluster-sg-oficina-') for x in aws('ec2','describe-security-groups')['SecurityGroups'])
          result['nlbs']=sum(x['LoadBalancerName'].startswith('oficina-') for x in aws('elbv2','describe-load-balancers')['LoadBalancers'])
          groups=[x for x in aws('ec2','describe-security-groups')['SecurityGroups'] if x['GroupName']=='oficina-homolog-customer-auth']
          result['lambda_security_groups']=len(groups)
          result['lambda_network_interfaces']=[]
          eni_ids=set()
          for group in groups:
              enis=aws('ec2','describe-network-interfaces','--filters','Name=group-id,Values='+group['GroupId'])['NetworkInterfaces']
              eni_ids.update(e['NetworkInterfaceId'] for e in enis)
              result['lambda_network_interfaces'] += [{'status':e['Status'],'type':e.get('InterfaceType'),'managed':e.get('RequesterManaged')} for e in enis]
          try:
              import collections
              start=(datetime.datetime.now(datetime.timezone.utc)-datetime.timedelta(minutes=40)).isoformat()
              events=aws('cloudtrail','lookup-events','--lookup-attributes','AttributeKey=EventName,AttributeValue=DeleteNetworkInterface','--start-time',start,'--max-items','50')['Events']
              codes=collections.Counter()
              for event in events:
                  record=json.loads(event['CloudTrailEvent'])
                  if (record.get('requestParameters') or {}).get('networkInterfaceId') in eni_ids:
                      codes[record.get('errorCode','success')]+=1
              result['lambda_network_delete_event_codes']=dict(codes)
          except subprocess.CalledProcessError:
              result['lambda_network_delete_event_codes']='unavailable'
          if result['eks']=='ACTIVE' and result['node_instances']:
              try:
                  import os
                  path=os.environ['RUNNER_TEMP']+'/fiap-status-kubeconfig'
                  subprocess.check_output(['aws','eks','update-kubeconfig','--name','oficina','--kubeconfig',path],text=True)
                  data=json.loads(subprocess.check_output(['kubectl','--kubeconfig',path,'get','pdb','-A','-o','json','--request-timeout=10s'],text=True,stderr=subprocess.PIPE))
                  result['disruption_budgets']=[{'namespace':x['metadata']['namespace'],'name':x['metadata']['name'],'allowed':x.get('status',{}).get('disruptionsAllowed'),'healthy':x.get('status',{}).get('currentHealthy'),'required':x.get('status',{}).get('desiredHealthy')} for x in data['items']]
                  os.unlink(path)
              except (subprocess.CalledProcessError,FileNotFoundError):
                  result['disruption_budgets']='unavailable'
          print(json.dumps(result))
          PYTHON
