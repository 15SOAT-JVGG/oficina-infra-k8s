name: Terraform

on:
  pull_request:
    branches: [main, homolog, production]
  push:
    branches: [homolog, production]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"

jobs:
  check:
    name: Format e validação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      - name: Testar convergência segura
        run: python3 -m unittest discover -s tests -v

  apply:
    name: Apply (${{ github.ref_name }})
    if: >-
      (github.event_name == 'push' && (github.ref_name == 'homolog' || github.ref_name == 'production')) ||
      (github.event_name == 'workflow_dispatch' && (github.ref_name == 'homolog' || github.ref_name == 'production'))
    needs: check
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    # Homolog e production compartilham o mesmo state; serializa para evitar disputa pelo lock.
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Terraform init (state compartilhado)
        env:
          AWS_ACCESS_KEY_ID: ${{ github.ref_name == 'homolog' && secrets.HOMOLOG_AWS_ACCESS_KEY_ID || github.ref_name == 'production' && secrets.AWS_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ github.ref_name == 'homolog' && secrets.HOMOLOG_AWS_SECRET_ACCESS_KEY || github.ref_name == 'production' && secrets.AWS_SECRET_ACCESS_KEY || '' }}
          AWS_SESSION_TOKEN: ${{ github.ref_name == 'homolog' && secrets.HOMOLOG_AWS_SESSION_TOKEN || github.ref_name == 'production' && secrets.AWS_SESSION_TOKEN || '' }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          [[ -n "$TF_STATE_BUCKET" ]] || { echo "Variable TF_STATE_BUCKET ausente" >&2; exit 1; }
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=oficina-infra-k8s/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"
          if ! terraform state list > /tmp/gateway-state-resources.txt 2>/tmp/terraform-state-list-error; then
            if grep -q 'No state file was found' /tmp/terraform-state-list-error; then
              : > /tmp/gateway-state-resources.txt
            else
              cat /tmp/terraform-state-list-error >&2
              exit 1
            fi
          fi

      - name: Reconciliar state compartilhado com contratos atuais
        env:
          AWS_ACCESS_KEY_ID: ${{ github.ref_name == 'homolog' && secrets.HOMOLOG_AWS_ACCESS_KEY_ID || github.ref_name == 'production' && secrets.AWS_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ github.ref_name == 'homolog' && secrets.HOMOLOG_AWS_SECRET_ACCESS_KEY || github.ref_name == 'production' && secrets.AWS_SECRET_ACCESS_KEY || '' }}
          AWS_SESSION_TOKEN: ${{ github.ref_name == 'homolog' && secrets.HOMOLOG_AWS_SESSION_TOKEN || github.ref_name == 'production' && secrets.AWS_SESSION_TOKEN || '' }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          CONTRACT_ENVIRONMENT: ${{ github.ref_name }}
          CONTRACT_SOURCE_KIND: infra
          CONTRACT_SOURCE_SHA: ${{ github.sha }}
        run: bash scripts/terraform-converge.sh infra
