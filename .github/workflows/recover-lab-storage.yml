name: Recover Learner Lab observability storage
on:
  push:
    branches: [codex/fix-lab-grafana]
  workflow_dispatch:
    inputs:
      apply:
        description: Remove only the unused failed EBS CSI add-on after guarded plan
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: terraform-apply
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref_name == 'codex/fix-lab-grafana' || github.ref_name == 'homolog'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: homolog
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.HOMOLOG_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HOMOLOG_AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.HOMOLOG_AWS_SESSION_TOKEN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: 'true'
      EXECUTE_RECOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0
      - run: scripts/recover-lab-storage.sh
