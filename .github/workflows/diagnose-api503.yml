name: Diagnose homolog API 503 read-only
on:
  push:
    branches: [codex/diag-api503]
  workflow_dispatch:
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: homolog
    timeout-minutes: 5
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.HOMOLOG_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HOMOLOG_AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.HOMOLOG_AWS_SESSION_TOKEN }}
    steps:
      - name: Classify Gateway errors without IPs, payloads or identities
        run: |
          set -euo pipefail
          umask 077
          log_file="$RUNNER_TEMP/gateway-errors.json"
          trap 'rm -f "$log_file"' EXIT
          aws logs filter-log-events --log-group-name /aws/apigateway/oficina-homolog \
            --start-time "$(( ($(date +%s) - 1800) * 1000 ))" \
            --filter-pattern '{ $.status = "503" }' --limit 100 --output json > "$log_file"
          python3 - "$log_file" <<'PYTHON'
          import collections, json, re, sys
          summary=collections.Counter()
          for event in json.load(open(sys.argv[1])).get('events',[]):
              record=json.loads(event['message'])
              error=str(record.get('integrationError','-'))
              error=re.sub(r'https?://\S+', '[endpoint]', error)
              error=re.sub(r'arn:[\w:/.-]+', '[resource]', error)
              error=re.sub(r'\S+@\S+', '[identity]', error)
              summary[(str(record.get('integrationStatus','-')), error[:300], str(record.get('integrationLatency','-')))] += 1
          for (status,error,latency),count in summary.items():
              print(json.dumps({'integration_status':status,'integration_error':error,'integration_latency_ms':latency,'count':count}))
          PYTHON

      - name: Inspect internal NLB zones, cross-zone routing and target health
        run: |
          set -euo pipefail
          umask 077
          contract="$RUNNER_TEMP/upstream.json"
          trap 'rm -f "$contract"' EXIT
          aws s3 cp "s3://$TF_STATE_BUCKET/oficina/config/v1/homolog/upstream.json" "$contract" --only-show-errors
          listener="$(jq -er '.integration_listener_arn' "$contract")"
          load_balancer="$(aws elbv2 describe-listeners --listener-arns "$listener" --query 'Listeners[0].LoadBalancerArn' --output text)"
          aws elbv2 describe-load-balancers --load-balancer-arns "$load_balancer" \
            --query 'LoadBalancers[].{scheme:Scheme,zones:AvailabilityZones[].ZoneName,state:State.Code}' --output json
          aws elbv2 describe-load-balancer-attributes --load-balancer-arn "$load_balancer" \
            --query 'Attributes[?contains(Key, `cross_zone`)]' --output json
          for target_group in $(aws elbv2 describe-target-groups --load-balancer-arn "$load_balancer" --query 'TargetGroups[].TargetGroupArn' --output text); do
            aws elbv2 describe-target-health --target-group-arn "$target_group" \
              --query 'TargetHealthDescriptions[].{zone:Target.AvailabilityZone,state:TargetHealth.State,reason:TargetHealth.Reason}' --output json
          done

      - name: Classify application failures without printing log contents
        run: |
          set -euo pipefail
          umask 077
          export KUBECONFIG="$RUNNER_TEMP/diagnostic-kubeconfig"
          log_file="$RUNNER_TEMP/app-diagnostic.log"
          trap 'rm -f "$KUBECONFIG" "$log_file"' EXIT
          aws eks update-kubeconfig --name oficina --region "$AWS_REGION" >/dev/null
          kubectl get hpa oficina-mecanica -n homolog -o json | jq '{current:.status.currentReplicas,desired:.status.desiredReplicas,metrics:.status.currentMetrics}'
          kubectl logs -n homolog -l app.kubernetes.io/name=oficina-mecanica --all-containers --since=45m --tail=1500 --max-log-requests=8 > "$log_file"
          python3 - "$log_file" <<'PYTHON'
          import json, re, sys
          data=open(sys.argv[1]).read()
          patterns={
              'notification_failed':r'Notificacao nao entregue',
              'smtp_mentions':r'smtp',
              'timeout_mentions':r'time.?out|timed out',
              'mail_rate_limit':r'too many emails|rate.?limit|sending limit|email limit',
              'smtp_4xx':r'\b4[125][012]\b',
              'smtp_5xx':r'\b5[035][0457]\b',
              'pool_timeout':r'connection.*pool.*timeout|acquisition timeout',
              'blocked_thread':r'blockedthread|thread.*blocked',
              'database_failure':r'PSQLException|PgException|SQLState',
              'metric_registration':r'MeterRegistration|already registered|Failed.*meter|Error.*meter|Prometheus',
              'metric_labels_mismatch':r'same set of tag keys|different label names',
              'invalid_histogram':r'buckets.*increasing|minimumExpectedValue|serviceLevelObjectiveBoundaries' 
          }
          print(json.dumps({key:len(re.findall(pattern,data,re.I)) for key,pattern in patterns.items()}))
          PYTHON
