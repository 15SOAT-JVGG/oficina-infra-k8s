name: Audit Grafana requirement evidence
on:
  push:
    branches: [codex/simplify-grafana, codex/http-evidence-guide, codex/phase3-business-dashboards, codex/phase3-final-evidence]
  workflow_dispatch:
    inputs:
      verify_simplified:
        type: boolean
        default: false
      verify_phase3:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: homolog
    timeout-minutes: 5
    env:
      GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
      REQUIRE_PHASE3: ${{ inputs.verify_phase3 && 'true' || 'false' }}
      REQUIRE_SIMPLE: ${{ inputs.verify_simplified && 'true' || 'false' }}
      GRAFANA_URL: https://dcs5hfax0e.execute-api.us-east-1.amazonaws.com/observability
    steps:
      - uses: actions/checkout@v4
      - run: python3 observability/scripts/audit-grafana.py
