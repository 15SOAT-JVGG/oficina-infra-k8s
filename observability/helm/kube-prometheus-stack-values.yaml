fullnameOverride: oficina-monitoring

defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false
    general: true
    k8s: true
    kubeApiserver: false
    kubePrometheusNodeAlerting: true
    kubePrometheusNodeRecording: true
    kubeScheduler: false
    kubeControllerManager: false
    kubeProxy: false
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    network: true
    node: true
    prometheus: true
    time: true

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    retention: 72h
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

grafana:
  enabled: true
  service:
    type: LoadBalancer
    port: 80
    targetPort: 3000
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-internal: "true"
  admin:
    existingSecret: oficina-grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/observability/"
      serve_from_sub_path: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: ALL
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki-gateway.observability.svc.cluster.local
      isDefault: false
      jsonData:
        derivedFields:
          - name: TraceID
            matcherType: json
            matcherRegex: '"traceId":"([A-Fa-f0-9]+)"'
            datasourceUid: tempo
            url: '${__value.raw}'
            urlDisplayLabel: Abrir trace
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.observability.svc.cluster.local:3200
      isDefault: false
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "1h"
          spanEndTimeShift: "1h"
          tags:
            - key: service.name
              value: service
          filterByTraceID: true
          filterBySpanID: false
        serviceMap:
          datasourceUid: prometheus
    - name: CloudWatch
      uid: cloudwatch
      type: cloudwatch
      access: proxy
      jsonData:
        authType: default
        defaultRegion: us-east-1
        timeout: 60

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

prometheusOperator:
  enabled: true

prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    retention: 7d
    scrapeInterval: 30s
    evaluationInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector:
      matchNames: [observability, homolog, production]
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector:
      matchNames: [observability, homolog, production]
    probeSelectorNilUsesHelmValues: false
    probeSelector: {}
    probeNamespaceSelector:
      matchNames: [observability]
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector:
      matchNames: [observability]
    externalLabels:
      cluster: oficina
    storageSpec:
      emptyDir:
        sizeLimit: 8Gi
    resources:
      requests:
        cpu: 300m
        memory: 768Mi
      limits:
        cpu: "1"
        memory: 1536Mi
    additionalScrapeConfigs: []

prometheus-node-exporter:
  prometheus:
    monitor:
      enabled: true

kube-state-metrics:
  prometheus:
    monitor:
      enabled: true
