replicas: 1
service:
  type: ClusterIP
  port: 9115
config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        method: GET
        follow_redirects: true
        preferred_ip_protocol: ip4
resources:
  requests:
    cpu: 25m
    memory: 48Mi
  limits:
    cpu: 100m
    memory: 128Mi
